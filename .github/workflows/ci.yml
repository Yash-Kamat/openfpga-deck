name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      - run: npx vsce package --target linux-x64 --out openfpga-deck-linux-x64.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: openfpga-deck-linux-x64.vsix
