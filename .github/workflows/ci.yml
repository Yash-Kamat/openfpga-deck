name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      - run: npx vsce package --out openfpga-deck.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: openfpga-deck.vsix
