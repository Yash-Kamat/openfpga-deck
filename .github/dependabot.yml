version: 2
updates:
  # Security fixes matter here (the `yaml` runtime dep, CI actions); routine
  # version bumps do not need to be noisy, so: monthly, one PR per ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
